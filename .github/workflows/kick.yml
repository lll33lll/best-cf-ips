name: Kick Mirror (oneshot)

on:
  push:
    paths:
      - .github/workflows/kick.yml

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch Mirror Best CF IPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -R "$GITHUB_REPOSITORY"
