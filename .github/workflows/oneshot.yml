name: Regenerate Now (oneshot)

on:
  push:
    paths:
      - .github/workflows/oneshot.yml

permissions:
  contents: write

concurrency:
  group: update-cf-ips
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch GeoLite2
        run: |
          mkdir -p geo
          curl -sL --retry 5 --retry-all-errors \
            -o geo/GeoLite2-City.mmdb.gz \
            "https://raw.githubusercontent.com/wp-statistics/GeoLite2-City/master/GeoLite2-City.mmdb.gz"
          gunzip -f geo/GeoLite2-City.mmdb.gz

      - name: Collect
        run: python collect.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best-cf-ip-*.txt
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "chore: regenerate $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep 5
          done
          exit 1
