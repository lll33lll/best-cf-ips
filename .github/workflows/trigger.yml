name: Trigger Update (oneshot)

on:
  push:
    paths:
      - .github/workflows/trigger.yml

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch update workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml --ref main \
            -f no_verify=false
          echo "已触发 update.yml"
