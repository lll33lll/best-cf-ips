name: Dump Failed Logs (oneshot)

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dump.yml

permissions:
  contents: write
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump latest update.yml run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "=== runs ==="
            gh run list --workflow=update.yml --limit 3 -R "$GITHUB_REPOSITORY"
            RUN_ID=$(gh run list --workflow=update.yml --limit 1 --json databaseId -q '.[0].databaseId' -R "$GITHUB_REPOSITORY")
            echo "=== log of run $RUN_ID ==="
            gh run view "$RUN_ID" --log-failed -R "$GITHUB_REPOSITORY" 2>&1 | tail -80
            echo "=== job list ==="
            gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" 2>&1 | head -40
          } > DUMP_LOG.txt 2>&1
          cat DUMP_LOG.txt

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DUMP_LOG.txt
          git commit -m "test: dump 日志" || echo "无变化"
          git push || echo "push 失败"
