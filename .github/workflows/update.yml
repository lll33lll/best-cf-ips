name: Mirror Best CF IPs

on:
  schedule:
    # 每 5 小时检查一次（UTC 0/5/10/15/20 点 37 分）
    # 上游每 6 小时更新，5 小时拍一次足以覆盖，且避开刚更新的时间点
    - cron: "37 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-cf-ips
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror upstream
        run: python mirror.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best-cf-ip-*.txt
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "mirror: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 与远端并发提交对齐，避免 push 被 rejected
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，重试..."
            sleep 5
          done
          echo "推送最终失败" >&2
          exit 1
